name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
          test -f "$SDK_ROOT/platforms/android-36/android.jar"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANGLE_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/angle-deck-signing.p12"
            echo "ANGLE_KEYSTORE_PATH=$RUNNER_TEMP/angle-deck-signing.p12" >> "$GITHUB_ENV"
          else
            echo 'WARNING: no persistent signing key; falling back to runner debug signing. APK updates may fail.'
          fi

      - name: Build debug APK
        env:
          ANGLE_KEYSTORE_PASS: ${{ secrets.ANGLE_KEYSTORE_PASS }}
          ANGLE_KEY_ALIAS: ${{ secrets.ANGLE_KEY_ALIAS }}
          ANGLE_KEY_PASS: ${{ secrets.ANGLE_KEY_PASS }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANGLE-Deck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
